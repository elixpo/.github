name: Verify organization README source

on:
  pull_request:
    paths:
      - "profile/README.md"
      - ".github/workflows/readme-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-readme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical organization README
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out the canonical source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elixpo/elixpo
          ref: main
          path: _canonical
          persist-credentials: false

      - name: Compare generated output
        run: cmp _canonical/docs/readme/generated/organization.md profile/README.md
